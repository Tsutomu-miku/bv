name: Fork Release Build

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      google_services_json:
        description: "google-services.json (optional)"

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          submodules: 'true'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Write google-services.json
        env:
          DATA: ${{ github.event.inputs.google_services_json }}
        run: echo $DATA > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build apk
        run: ./gradlew assembleDefaultAlpha assembleDefaultDebug

      - name: Read alpha apk output metadata
        id: apk-meta-alpha
        uses: juliangruber/read-file-action@v1
        with:
          path: app/build/outputs/apk/default/alpha/output-metadata.json

      - name: Read debug apk output metadata
        id: apk-meta-debug
        uses: juliangruber/read-file-action@v1
        with:
          path: app/build/outputs/apk/default/debug/output-metadata.json

      - name: Parse apk infos
        run: |
          echo "alpha_version_code=${{ fromJson(steps.apk-meta-alpha.outputs.content).elements[0].versionCode }}" >> $GITHUB_ENV
          echo "alpha_version_name=${{ fromJson(steps.apk-meta-alpha.outputs.content).elements[0].versionName }}" >> $GITHUB_ENV
          echo "debug_version_code=${{ fromJson(steps.apk-meta-debug.outputs.content).elements[0].versionCode }}" >> $GITHUB_ENV
          echo "debug_version_name=${{ fromJson(steps.apk-meta-debug.outputs.content).elements[0].versionName }}" >> $GITHUB_ENV

      - name: Generate tag name
        run: echo "tag_name=fork-r${{ env.alpha_version_code }}-$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Get changelog
        run: |
          {
            echo "changelog<<EOF"
            echo "$(git log --pretty=format:'- %s (%h)' -10)"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # Upload artifacts for download from Actions page

      - name: Archive alpha build artifact (universal)
        uses: actions/upload-artifact@v4
        with:
          name: BV Alpha APK (universal)
          path: app/build/outputs/apk/default/alpha/BV_${{ env.alpha_version_code }}_${{ env.alpha_version_name }}_default_universal.apk

      - name: Archive debug build artifact (universal)
        uses: actions/upload-artifact@v4
        with:
          name: BV Debug APK (universal)
          path: app/build/outputs/apk/default/debug/BV_${{ env.debug_version_code }}_${{ env.debug_version_name }}_default_universal.apk

      - name: Archive alpha build mappings
        uses: actions/upload-artifact@v4
        with:
          name: Alpha build mappings
          path: app/build/outputs/mapping/defaultAlpha

      # Zip mapping for release attachment

      - name: Zip mapping
        run: zip -rj mapping.zip app/build/outputs/mapping/defaultAlpha

      # Create GitHub Release with APK download

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/default/alpha/BV_${{ env.alpha_version_code }}_${{ env.alpha_version_name }}_default_universal.apk
            app/build/outputs/apk/default/debug/BV_${{ env.debug_version_code }}_${{ env.debug_version_name }}_default_universal.apk
            mapping.zip
          tag_name: ${{ env.tag_name }}
          name: "BV ${{ env.alpha_version_name }} (no-region-check)"
          prerelease: true
          body: |
            ## BV ${{ env.alpha_version_name }} (Fork - No Region Check)

            This is an unsigned build from the fork with mainland China region check removed.

            ### APK Files
            - **Alpha APK** - Optimized build (smaller, with ProGuard)
            - **Debug APK** - Full debug build (larger, with debug symbols)

            ### Recent Changes
            ${{ env.changelog }}
          target_commitish: ${{ github.sha }}
